<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenMarket</title>
</head>
<body>
<div id="root"></div>
<script>
  (function() {
    if (!process.env.HOT) {
      return;
    }
    const script = document.createElement('script');
    const port = process.env.PORT || 3000;
    script.src = 'http://localhost:' + port + '/dist/bundle.js';
    document.body.appendChild(script);
  }());
</script>
</body>
</html>

name: CI

on:
  push:
  pull_request:

jobs:
  # Decides whether anything outside docs changed. Docs-only changes skip the heavy jobs.
  # Docs = docs/**, **/*.md, .grok/**, LICENSE. Everything else (including .github/**) counts as code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE=$(git merge-base "$PR_BASE" HEAD)
          else
            BASE="$PUSH_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base ($BASE); running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"; echo "$CHANGED"
          CODE=$(echo "$CHANGED" | grep -v -E '^(docs/|\.grok/)|\.md$|^LICENSE$' | grep -c . || true)
          if [ "$CODE" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "Non-docs files changed: $CODE"

  test-and-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Typecheck (JSDoc via tsc --noEmit)
        run: npm run typecheck
      - run: npm run test-all
      - run: npm run build
      - name: Install Electron libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libasound2t64 libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libcups2
      - name: UI
        run: xvfb-run -a npm run test:ui

  # Quality report (CRAP + duplication) from tools/quality. Report-only: findings never fail CI.
  # Mutation testing is too slow for CI; run `npm run mutate -- <file>` locally.
  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: CRAP report (complexity x lack of coverage)
        continue-on-error: true
        run: npm run crap
      - name: Duplication report
        continue-on-error: true
        run: npm run dry

  version-decision:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version decision
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          BASE=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(0,'utf8')); process.stdout.write(p.version)" < <(git show "${{ github.event.pull_request.base.sha }}:package.json"))
          HEAD=$(node -p "require('./package.json').version")
          node .github/scripts/version-decision.js "$BASE" "$HEAD"

  package:
    needs: [changes, test-and-build]
    if: success() && needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            npm_script: package-linux
            artifact: linux
          - os: windows-latest
            npm_script: package-win
            artifact: windows
          - os: macos-latest
            npm_script: package-mac
            artifact: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package
        run: npm run ${{ matrix.npm_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke-launch Linux installers
        if: matrix.artifact == 'linux'
        env:
          OPENMARKET_SMOKE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libasound2t64 libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libcups2
          shopt -s nullglob
          appimages=(release/*.AppImage)
          debs=(release/*.deb)
          test ${#appimages[@]} -eq 1
          test ${#debs[@]} -eq 1
          chmod +x "${appimages[0]}"
          node .github/scripts/smoke-launch.js xvfb-run -a "${appimages[0]}" --no-sandbox --disable-gpu
          sudo apt-get install -y "./${debs[0]}"
          bin=$(find /opt -type f -name openmarket -executable | head -n 1)
          test -n "$bin"
          node .github/scripts/smoke-launch.js xvfb-run -a "$bin" --no-sandbox --disable-gpu
      - name: Smoke-launch Windows installer
        if: matrix.artifact == 'windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          OPENMARKET_SMOKE: "1"
        run: |
          $installer = Get-ChildItem release -Filter *.exe |
            Where-Object { $_.Name -notlike '*uninstaller*' } |
            Select-Object -First 1
          if ($null -eq $installer) { throw "no installer" }
          Write-Host "Installing $($installer.FullName)"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if (-not $proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "installer timed out"
          }
          if ($proc.ExitCode -ne 0) { throw "installer exit $($proc.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\OpenMarket\OpenMarket.exe"
          if (-not (Test-Path $installed)) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table FullName
            throw "installed OpenMarket.exe not found at $installed"
          }
          node .github/scripts/smoke-launch.js $installed --disable-gpu
      - name: Smoke-launch macOS app
        if: matrix.artifact == 'macos'
        env:
          OPENMARKET_SMOKE: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(release/*.zip)
          test ${#zips[@]} -eq 1
          rm -rf /tmp/openmarket-smoke
          mkdir -p /tmp/openmarket-smoke
          unzip -q "${zips[0]}" -d /tmp/openmarket-smoke
          bin=$(find /tmp/openmarket-smoke -type f -path '*.app/Contents/MacOS/OpenMarket' | head -n 1)
          test -n "$bin"
          node .github/scripts/smoke-launch.js "$bin" --disable-gpu --no-sandbox
      - name: Upload Linux installers
        if: matrix.artifact == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: openmarket-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
      - name: Upload Windows installer
        if: matrix.artifact == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: openmarket-windows
          if-no-files-found: error
          path: release/*.exe
      - name: Upload macOS installers
        if: matrix.artifact == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: openmarket-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  # Single stable check for rulesets: passes when every job succeeded or was skipped.
  ci-ok:
    if: always()
    needs: [changes, test-and-build, quality, version-decision, package]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A required job ended as $r"; exit 1;; esac
          done

  publish:
    needs: package
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openmarket-*
          path: dist-releases
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          TAG="v${BASE}"
          NOTES=$(git log -1 --pretty=%B)
          shopt -s nullglob
          files=(dist-releases/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts downloaded" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "OpenMarket ${TAG}" \
              --notes "$NOTES"
          fi
